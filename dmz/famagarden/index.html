<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Famagarden</title>
<style>
  :root {
    --green: #39a844;
    --green-dark: #176b35;
    --ink: #171b16;
    --paper: #f8f3df;
    --paper-shadow: #c9bd96;
    --hp-green: #58b947;
    --hp-yellow: #e3b73b;
    --hp-red: #d4513f;
    --hp-track: #2b3029;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; overflow: hidden; }
  body {
    background: #0e1711;
    color: var(--paper);
    font-family: "Courier New", ui-monospace, monospace;
    image-rendering: pixelated;
  }

  .splash {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #79d8b8;
    transition: opacity 0.12s steps(1, end), visibility 0.12s steps(1, end);
  }

  .splash.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    image-rendering: pixelated;
  }

  .carousel {
    width: 100vw;
    height: 100svh;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: #0e1711;
  }

  .carousel::-webkit-scrollbar { display: none; }

  .scene {
    position: relative;
    flex: 0 0 100vw;
    height: 100svh;
    scroll-snap-align: center;
    overflow: hidden;
    background: #0e1711;
  }

  .scene img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
  }

  .scene.is-exhausted img {
    filter: grayscale(1) contrast(0.92) brightness(0.78);
  }

  .scene.is-exhausted .scene-overlay::before {
    background:
      linear-gradient(0deg,
        rgba(4, 5, 5, 0.90) 0%,
        rgba(8, 9, 9, 0.72) 22%,
        rgba(16, 16, 16, 0.44) 48%,
        rgba(16, 16, 16, 0.14) 72%,
        transparent 100%);
  }

  .scene-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 36svh;
    padding: clamp(64px, 14vh, 142px) clamp(22px, 6vw, 76px) max(58px, calc(44px + env(safe-area-inset-bottom)));
    color: rgba(255,255,255,0.94);
    text-align: left;
    pointer-events: none;
  }

  .scene-overlay::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(72% 70% at 10% 78%, rgba(64, 150, 98, 0.20), transparent 64%),
      linear-gradient(0deg,
        rgba(4, 8, 6, 0.86) 0%,
        rgba(6, 12, 9, 0.70) 20%,
        rgba(8, 15, 11, 0.42) 45%,
        rgba(8, 15, 11, 0.14) 70%,
        transparent 100%);
    backdrop-filter: blur(14px) saturate(1.18);
    -webkit-backdrop-filter: blur(14px) saturate(1.18);
    mask-image: linear-gradient(0deg, #000 0%, rgba(0,0,0,0.92) 30%, rgba(0,0,0,0.48) 60%, transparent 100%);
    -webkit-mask-image: linear-gradient(0deg, #000 0%, rgba(0,0,0,0.92) 30%, rgba(0,0,0,0.48) 60%, transparent 100%);
    pointer-events: none;
  }

  .plant-name {
    position: relative;
    z-index: 2;
    margin: 0 0 8px;
    font-size: clamp(34px, 7vw, 72px);
    line-height: 1;
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 0 4px 18px rgba(0,0,0,0.58);
  }

  .plant-type {
    position: relative;
    z-index: 2;
    margin: 0 0 18px;
    color: rgba(255,255,255,0.76);
    font-size: clamp(13px, 2.7vw, 22px);
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 0 3px 14px rgba(0,0,0,0.54);
  }

  .hp-row {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    width: min(560px, 100%);
    margin: 0;
  }

  .hp-label,
  .hp-value {
    font-size: clamp(13px, 2.5vw, 17px);
    font-weight: 900;
    color: rgba(255,255,255,0.88);
    text-shadow: 0 3px 12px rgba(0,0,0,0.5);
  }

  .hp-track {
    height: 12px;
    padding: 2px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.28);
    overflow: hidden;
  }

  .hp-fill {
    width: 0%;
    height: 100%;
    background: var(--hp-green);
    border-radius: inherit;
    box-shadow: 0 0 18px rgba(88,185,71,0.55);
  }

  .hp-fill[data-tone="yellow"] { background: var(--hp-yellow); }
  .hp-fill[data-tone="red"] { background: var(--hp-red); }
  .hp-fill[data-tone="empty"] {
    background: rgba(255,255,255,0.40);
    box-shadow: none;
  }

  .exhausted-label {
    position: relative;
    z-index: 2;
    display: inline-block;
    margin-bottom: 12px;
    padding: 7px 11px;
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px;
    color: rgba(255,255,255,0.94);
    background: rgba(190, 35, 32, 0.84);
    box-shadow: 0 8px 24px rgba(120,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.18);
    font-size: clamp(11px, 2vw, 13px);
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .radio-row {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(560px, 100%);
    margin-top: 10px;
    pointer-events: auto;
  }

  .radio-button {
    flex: 0 0 auto;
    min-width: 76px;
    min-height: 32px;
    padding: 7px 12px;
    border: 1px solid rgba(255,255,255,0.32);
    border-radius: 999px;
    color: rgba(255,255,255,0.94);
    background: rgba(12, 20, 16, 0.46);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 22px rgba(0,0,0,0.24);
    backdrop-filter: blur(12px) saturate(1.22);
    -webkit-backdrop-filter: blur(12px) saturate(1.22);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
  }

  .radio-button:disabled {
    cursor: default;
    opacity: 0.52;
  }

  .radio-title {
    min-width: 0;
    color: rgba(255,255,255,0.72);
    font-size: clamp(11px, 2.2vw, 14px);
    font-weight: 900;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 3px 12px rgba(0,0,0,0.52);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .scene-dots {
    position: fixed;
    left: 50%;
    bottom: max(18px, calc(14px + env(safe-area-inset-bottom)));
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 6px 9px;
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 999px;
    background: rgba(14, 23, 17, 0.34);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.24), 0 10px 24px rgba(0,0,0,0.28);
    backdrop-filter: blur(16px) saturate(1.35);
    -webkit-backdrop-filter: blur(16px) saturate(1.35);
    transform: translateX(-50%);
  }

  .scene-dot {
    width: 7px;
    height: 7px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.42);
    cursor: pointer;
    transition: transform 0.16s ease, width 0.16s ease, background 0.16s ease;
  }

  .scene-dot.active {
    width: 20px;
    border-radius: 999px;
    background: rgba(255,255,255,0.94);
    transform: scale(1.05);
  }

  .empty {
    width: 100vw;
    height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--paper);
    text-align: center;
    font-size: 20px;
    background: #0e1711;
  }

  @media (min-width: 760px) {
    .scene img { object-fit: contain; background: #0e1711; }
    .scene-overlay {
      padding-left: clamp(48px, 8vw, 132px);
      padding-right: clamp(48px, 8vw, 132px);
    }
  }
</style>
</head>
<body>
  <div class="splash" aria-hidden="true">
    <img src="assets/splash/famagarden-splash.png" alt="" />
  </div>

  <main class="carousel" id="carousel" aria-label="Scene Famagarden"></main>
  <div class="scene-dots" id="scene-dots" aria-label="Indicatore scene"></div>

<script>
(function () {
  "use strict";

  var HOURS_BETWEEN = {
    rio: 168,
    carmine: 168,
    ermenetiglio: 96,
    gino: 432,
    enrica: 144,
    gessika: 72,
    tolino: 600,
    bruce: 360,
    elsa: 144,
    edda: 144,
    erik: 168
  };
  var DEFAULT_HOURS_BETWEEN = 168;
  var SCENES = {
    rio: "assets/scenes/rio.png",
    carmine: "assets/scenes/carmine.png",
    ermenetiglio: "assets/scenes/ermenetiglio.png",
    gino: "assets/scenes/gino.png",
    enrica: "assets/scenes/enrica.png",
    gessika: "assets/scenes/gessika.png",
    tolino: "assets/scenes/tolino.png",
    bruce: "assets/scenes/bruce.png",
    elsa: "assets/scenes/elsa.png",
    edda: "assets/scenes/edda.png",
    erik: "assets/scenes/erik.png"
  };
  var RADIO_STATIONS = {
    rio: station("Groove Salad", "groovesalad", "https://ice5.somafm.com/groovesalad-128-mp3"),
    carmine: station("Beat Blender", "beatblender", "https://ice5.somafm.com/beatblender-128-mp3"),
    ermenetiglio: station("Drone Zone", "dronezone", "https://ice5.somafm.com/dronezone-128-mp3"),
    gino: station("Deep Space One", "deepspaceone", "https://ice5.somafm.com/deepspaceone-128-mp3"),
    enrica: station("Fluid", "fluid", "https://ice5.somafm.com/fluid-128-mp3"),
    gessika: station("Vaporwaves", "vaporwaves", "https://ice5.somafm.com/vaporwaves-128-mp3"),
    tolino: station("Mission Control", "missioncontrol", "https://ice5.somafm.com/missioncontrol-128-mp3"),
    bruce: station("Drone Zone", "dronezone", "https://ice5.somafm.com/dronezone-128-mp3"),
    elsa: station("Lush", "lush", "https://ice5.somafm.com/lush-128-mp3"),
    edda: station("Bossa Beyond", "bossa", "https://ice5.somafm.com/bossa-128-mp3"),
    erik: station("Groove Salad", "groovesalad", "https://ice5.somafm.com/groovesalad-128-mp3")
  };

  var carousel = document.getElementById("carousel");
  var sceneDots = document.getElementById("scene-dots");
  var splash = document.querySelector(".splash");
  var audio = new Audio();
  var plants = [];
  var currentIndex = 0;
  var playingPlant = null;
  var titleTimer = null;

  audio.preload = "none";

  function station(name, slug, streamUrl) {
    return {
      name: name,
      slug: slug,
      streamUrl: streamUrl,
      titleUrl: "https://somafm.com/songs/" + slug + ".json"
    };
  }

  setTimeout(function () {
    if (splash) splash.classList.add("is-hidden");
  }, 1000);

  function hoursSinceWatering(plant) {
    if (!plant.ultimaInnaffiata) return null;
    var last = new Date(plant.ultimaInnaffiata).getTime();
    if (isNaN(last)) return null;
    return Math.max(0, (Date.now() - last) / 3600000);
  }

  function healthFor(plant) {
    if (Number(plant.livello) === 0) return 0;
    var hours = hoursSinceWatering(plant);
    if (hours === null) return 100;
    var hoursBetween = HOURS_BETWEEN[plant.id] || DEFAULT_HOURS_BETWEEN;
    return Math.max(0, Math.min(100, 100 - (hours / hoursBetween) * 100));
  }

  function toneFor(pct) {
    if (pct <= 0) return "empty";
    if (pct <= 20) return "red";
    if (pct <= 50) return "yellow";
    return "green";
  }

  function createScene(plant) {
    var isExhausted = Number(plant.livello) === 0;
    var scene = document.createElement("section");
    scene.className = "scene";
    if (isExhausted) scene.classList.add("is-exhausted");
    scene.setAttribute("aria-label", plant.nome);

    var image = document.createElement("img");
    image.src = SCENES[plant.id];
    image.alt = "";
    scene.appendChild(image);

    var overlay = document.createElement("div");
    overlay.className = "scene-overlay";

    var name = document.createElement("h1");
    name.className = "plant-name";
    name.textContent = plant.nome;
    overlay.appendChild(name);

    var type = document.createElement("p");
    type.className = "plant-type";
    type.textContent = plant.specie || "Pianta";
    overlay.appendChild(type);

    if (isExhausted) {
      var exhausted = document.createElement("span");
      exhausted.className = "exhausted-label";
      exhausted.textContent = "Esausta";
      overlay.appendChild(exhausted);
    }

    if (!isExhausted) {
      var hpRow = document.createElement("div");
      hpRow.className = "hp-row";

      var label = document.createElement("span");
      label.className = "hp-label";
      label.textContent = "HP";
      hpRow.appendChild(label);

      var track = document.createElement("div");
      track.className = "hp-track";
      var fill = document.createElement("div");
      fill.className = "hp-fill";
      track.appendChild(fill);
      hpRow.appendChild(track);

      var value = document.createElement("span");
      value.className = "hp-value";
      hpRow.appendChild(value);

      overlay.appendChild(hpRow);

      var radio = createRadioControl(plant);
      overlay.appendChild(radio);

      plant._fill = fill;
      plant._value = value;
    }

    scene.appendChild(overlay);
    carousel.appendChild(scene);

    updateHealth(plant);
  }

  function updateHealth(plant) {
    if (!plant._fill || !plant._value) return;
    var pct = healthFor(plant);
    plant._fill.style.width = pct + "%";
    plant._fill.setAttribute("data-tone", toneFor(pct));
    plant._value.textContent = Math.round(pct) + "%";
  }

  function createRadioControl(plant) {
    var station = RADIO_STATIONS[plant.id];
    var row = document.createElement("div");
    row.className = "radio-row";

    var button = document.createElement("button");
    button.type = "button";
    button.className = "radio-button";
    button.textContent = "Play";
    button.addEventListener("click", function () { toggleRadio(plant); });
    row.appendChild(button);

    var title = document.createElement("span");
    title.className = "radio-title";
    title.textContent = station ? station.name : "Radio non disponibile";
    row.appendChild(title);

    plant._radioButton = button;
    plant._radioTitle = title;
    if (!station) button.disabled = true;

    loadNowPlaying(plant);
    return row;
  }

  function setRadioUi(plant, isPlaying, label) {
    if (!plant || !plant._radioButton || !plant._radioTitle) return;
    plant._radioButton.textContent = isPlaying ? "Stop" : "Play";
    if (label) plant._radioTitle.textContent = label;
  }

  function formatSong(song, fallback) {
    if (!song) return fallback;
    if (song.artist && song.title) return song.artist + " - " + song.title;
    return song.title || song.artist || fallback;
  }

  function loadNowPlaying(plant) {
    var station = RADIO_STATIONS[plant.id];
    if (!station || !plant._radioTitle) return Promise.resolve();
    return fetch(station.titleUrl + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("Titolo non disponibile");
        return response.json();
      })
      .then(function (data) {
        var title = formatSong(data.songs && data.songs[0], station.name);
        if (plant._radioTitle) plant._radioTitle.textContent = title;
      })
      .catch(function () {
        if (plant._radioTitle) plant._radioTitle.textContent = station.name;
      });
  }

  function stopRadio() {
    if (!playingPlant) return;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    setRadioUi(playingPlant, false);
    playingPlant = null;
    clearInterval(titleTimer);
    titleTimer = null;
  }

  function startRadio(plant) {
    var station = RADIO_STATIONS[plant.id];
    if (!station) return;
    stopRadio();
    playingPlant = plant;
    audio.src = station.streamUrl;
    setRadioUi(plant, true, "Connessione a " + station.name + "...");
    loadNowPlaying(plant);
    audio.play()
      .then(function () {
        setRadioUi(plant, true);
        titleTimer = setInterval(function () { loadNowPlaying(plant); }, 30000);
      })
      .catch(function () {
        setRadioUi(plant, false, "Tocca Play per avviare la radio");
        playingPlant = null;
      });
  }

  function toggleRadio(plant) {
    if (playingPlant === plant) {
      stopRadio();
      return;
    }
    startRadio(plant);
  }

  function refreshHealth() {
    plants.forEach(updateHealth);
  }

  function updateDots() {
    Array.prototype.forEach.call(sceneDots.children, function (dot, idx) {
      dot.classList.toggle("active", idx === currentIndex);
    });
  }

  function scrollToScene(idx) {
    var nextIndex = Math.max(0, Math.min(plants.length - 1, idx));
    if (nextIndex !== currentIndex) stopRadio();
    currentIndex = nextIndex;
    updateDots();
    carousel.scrollTo({ left: currentIndex * carousel.clientWidth, behavior: "smooth" });
  }

  function buildDots() {
    sceneDots.innerHTML = "";
    plants.forEach(function (plant, idx) {
      var dot = document.createElement("button");
      dot.type = "button";
      dot.className = "scene-dot" + (idx === currentIndex ? " active" : "");
      dot.setAttribute("aria-label", plant.nome);
      dot.addEventListener("click", function () { scrollToScene(idx); });
      sceneDots.appendChild(dot);
    });
  }

  function render(list) {
    plants = list.filter(function (plant) { return SCENES[plant.id]; });
    carousel.innerHTML = "";
    sceneDots.innerHTML = "";
    currentIndex = 0;

    if (!plants.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nessuna scena disponibile";
      carousel.appendChild(empty);
      return;
    }

    plants.forEach(createScene);
    buildDots();
    setInterval(refreshHealth, 60000);
  }

  var scrollTimer = null;
  carousel.addEventListener("scroll", function () {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () {
      var idx = Math.round(carousel.scrollLeft / (carousel.clientWidth || 1));
      var nextIndex = Math.max(0, Math.min(plants.length - 1, idx));
      if (nextIndex !== currentIndex) stopRadio();
      currentIndex = nextIndex;
      updateDots();
    }, 80);
  }, { passive: true });

  fetch("piante.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error("piante.json non raggiungibile");
      return response.json();
    })
    .then(render)
    .catch(function () { render([]); });
})();
</script>
</body>
</html>
